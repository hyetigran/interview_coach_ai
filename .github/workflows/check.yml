name: Check
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:migrate:local
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Recovery fixtures finish without provider requests, but their controls
      # require a configured key. This invalid value cannot authorize paid calls.
      - run: echo 'OPENAI_API_KEY=local-test-placeholder-not-a-provider-credential' >> .dev.vars
      - run: pnpm test:e2e
